<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TaskDeck コマンドパレット</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
input[type="checkbox"] { accent-color: #0067c0; }
</style>
</helmet>
<div style="width: 820px; height: 620px; box-sizing: border-box; padding: 40px 60px; display: flex; flex-direction: column; align-items: center; gap: 12px; background: #a9aeb5;">

  <div style="width: 100%; border-radius: 10px; background: #ffffff; border: 1px solid #d2d2d2; box-shadow: 0 16px 40px rgba(0,0,0,0.32), 0 2px 8px rgba(0,0,0,0.18); overflow: hidden;">

    <div style="display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 18px; border-bottom: 1px solid #ededed;">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#6e6e6e" stroke-width="1.6" stroke-linecap="round" style="flex-shrink: 0;"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <span style="flex-grow: 1; font-size: 16px; color: #1a1a1a;">会議<span style="display: inline-block; width: 1.5px; height: 19px; background: #1a1a1a; margin-left: 1px; vertical-align: -4px;"></span></span>
      <span style="font-size: 11px; color: #6e6e6e; background: #f2f2f2; padding: 3px 8px; border-radius: 4px; font-family: Consolas, monospace;">Ctrl+K</span>
    </div>

    <div style="padding: 6px 0;">

      <div style="padding: 8px 18px 4px 18px; font-size: 11px; font-weight: 600; color: #6e6e6e; letter-spacing: 0.03em;">タスク</div>

      <div style="position: relative; display: flex; align-items: center; gap: 11px; height: 40px; padding: 0 18px; background: #eff6fc;">
        <div style="position: absolute; left: 0; top: 10px; width: 3px; height: 20px; border-radius: 2px; background: #0067c0;"></div>
        <input type="checkbox" aria-label="会議資料まとめる を完了にする" style="width: 16px; height: 16px; margin: 0; flex-shrink: 0;">
        <span style="font-size: 11px; font-weight: 700; color: #f7630c; width: 20px; flex-shrink: 0;">!!!</span>
        <span style="flex-grow: 1; font-size: 14px;"><span style="font-weight: 600; color: #0067c0;">会議</span>資料まとめる</span>
        <span style="font-size: 11px; color: #5d5d5d; background: #ffffff; padding: 2px 7px; border-radius: 10px;">業務改善</span>
        <span style="font-size: 12px; font-weight: 600; width: 74px; text-align: right; font-variant-numeric: tabular-nums;">今日 15:00</span>
      </div>

      <div style="display: flex; align-items: center; gap: 11px; height: 40px; padding: 0 18px;">
        <input type="checkbox" aria-label="定例ミーティングの準備 を完了にする" style="width: 16px; height: 16px; margin: 0; flex-shrink: 0;">
        <span style="width: 20px; flex-shrink: 0;"></span>
        <span style="flex-grow: 1; font-size: 14px;">定例ミーティングの準備</span>
        <span style="font-size: 11px; color: #5d5d5d; background: #f2f2f2; padding: 2px 7px; border-radius: 10px;">業務改善</span>
        <span style="font-size: 12px; color: #5d5d5d; width: 74px; text-align: right; font-variant-numeric: tabular-nums;">9/23</span>
      </div>

      <div style="display: flex; align-items: center; gap: 11px; height: 40px; padding: 0 18px;">
        <input type="checkbox" checked aria-label="会議室を予約する を未完了にする" style="width: 16px; height: 16px; margin: 0; flex-shrink: 0;">
        <span style="width: 20px; flex-shrink: 0;"></span>
        <span style="flex-grow: 1; font-size: 14px; color: #6e6e6e; text-decoration: line-through;"><span style="font-weight: 600;">会議</span>室を予約する</span>
        <span style="font-size: 11px; color: #6e6e6e;">完了済み</span>
        <span style="font-size: 12px; color: #6e6e6e; width: 74px; text-align: right; font-variant-numeric: tabular-nums;">9/18</span>
      </div>

      <div style="height: 1px; background: #f0f0f0; margin: 6px 18px;"></div>
      <div style="padding: 2px 18px 4px 18px; font-size: 11px; font-weight: 600; color: #6e6e6e; letter-spacing: 0.03em;">コマンド</div>

      <div style="display: flex; align-items: center; gap: 11px; height: 40px; padding: 0 18px;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#0067c0" stroke-width="1.6" stroke-linecap="round" style="flex-shrink: 0;"><path d="M8 3.5v9M3.5 8h9"/></svg>
        <span style="flex-grow: 1; font-size: 14px;">「会議」という名前でタスクを追加</span>
        <span style="font-size: 11px; color: #6e6e6e; background: #f2f2f2; padding: 2px 7px; border-radius: 4px; font-family: Consolas, monospace;">Ctrl+Enter</span>
      </div>

      <div style="display: flex; align-items: center; gap: 11px; height: 40px; padding: 0 18px;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#3a3a3a" stroke-width="1.5" stroke-linecap="round" style="flex-shrink: 0;"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5.5 1.6v2.4M10.5 1.6v2.4"/></svg>
        <span style="flex-grow: 1; font-size: 14px;">期限切れをまとめて今日へ繰り越す</span>
        <span style="font-size: 11px; color: #5d5d5d;">2 件</span>
      </div>

      <div style="height: 1px; background: #f0f0f0; margin: 6px 18px;"></div>
      <div style="padding: 2px 18px 4px 18px; font-size: 11px; font-weight: 600; color: #6e6e6e; letter-spacing: 0.03em;">移動</div>

      <div style="display: flex; align-items: center; gap: 11px; height: 40px; padding: 0 18px;">
        <span style="width: 16px; display: flex; justify-content: center; flex-shrink: 0;"><span style="width: 9px; height: 9px; border-radius: 50%; background: #0067c0;"></span></span>
        <span style="flex-grow: 1; font-size: 14px;">プロジェクト「業務改善」を開く</span>
        <span style="font-size: 11px; color: #5d5d5d;">5 件</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; height: 34px; padding: 0 18px; background: #f6f6f6; border-top: 1px solid #ededed; font-size: 11px; color: #5d5d5d;">
      <span><strong style="font-weight: 600;">↑↓</strong> 選択</span>
      <span><strong style="font-weight: 600;">Enter</strong> 開く</span>
      <span><strong style="font-weight: 600;">Space</strong> 完了</span>
      <span><strong style="font-weight: 600;">Esc</strong> 閉じる</span>
      <div style="flex-grow: 1;"></div>
      <span style="color: #6e6e6e;">3 件のタスク・3 件のコマンド</span>
    </div>
  </div>

  <div style="width: 100%; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 13px; background: rgba(255,255,255,0.85); border: 1px solid rgba(0,0,0,0.10); font-size: 11px; color: #33383e;"><strong style="font-family: Consolas, monospace; color: #0067c0;">&gt;</strong> コマンドだけ</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 13px; background: rgba(255,255,255,0.85); border: 1px solid rgba(0,0,0,0.10); font-size: 11px; color: #33383e;"><strong style="font-family: Consolas, monospace; color: #0067c0;">#</strong> タグ</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 13px; background: rgba(255,255,255,0.85); border: 1px solid rgba(0,0,0,0.10); font-size: 11px; color: #33383e;"><strong style="font-family: Consolas, monospace; color: #0067c0;">@</strong> プロジェクト</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 13px; background: rgba(255,255,255,0.85); border: 1px solid rgba(0,0,0,0.10); font-size: 11px; color: #33383e;"><strong style="font-family: Consolas, monospace; color: #0067c0;">/</strong> ビュー移動</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 13px; background: rgba(255,255,255,0.85); border: 1px solid rgba(0,0,0,0.10); font-size: 11px; color: #33383e;"><strong style="font-family: Consolas, monospace; color: #0067c0;">?</strong> ヘルプ</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":620}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
