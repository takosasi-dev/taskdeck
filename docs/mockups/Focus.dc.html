<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TaskDeck フォーカスモード</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; background: #14161a; }
input[type="checkbox"] { accent-color: #4cc2ff; }
</style>
</helmet>
<div style="width: 900px; height: 640px; box-sizing: border-box; display: flex; flex-direction: column; background: #14161a; color: #ffffff; border-radius: 12px; overflow: hidden; position: relative;">

  <div style="height: 3px; flex-shrink: 0; background: #23262c;">
    <div style="width: 62%; height: 100%; background: #0067c0;"></div>
  </div>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 20px 32px 0 32px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#5f6670" stroke-width="1.5" stroke-linecap="round"><path d="M8 4.5V8l2.2 1.4"/><circle cx="8" cy="8" r="6"/></svg>
      <span style="font-size: 12px; color: #7a8089;">今日 ・ 残り 6 件</span>
    </div>
    <div style="flex-grow: 1;"></div>
    <span style="font-size: 12px; color: #7a8089;">5 件目 / 11 件</span>
    <button type="button" aria-label="フォーカスモードを終了" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 4px; cursor: pointer; color: #5f6670;"><svg width="11" height="11" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 64px; min-height: 0;">

    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 14px;">
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; background: rgba(255,255,255,0.07); font-size: 11px; color: #c8ccd2;">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #4ba8e0;"></span>業務改善
      </span>
      <span style="font-size: 11px; font-weight: 700; color: #ff8c42;">!!!</span>
      <span style="font-size: 11px; color: #7a8089;">#仕事</span>
    </div>

    <h1 style="margin: 0; font-size: 36px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.3;">会議資料まとめる</h1>

    <div style="display: flex; align-items: center; gap: 10px; margin-top: 12px;">
      <span style="font-size: 14px; color: #c8ccd2;">15:00 まで</span>
      <span style="width: 3px; height: 3px; border-radius: 50%; background: #464c55;"></span>
      <span style="font-size: 14px; color: #ffb64d;">あと 1 時間 12 分</span>
    </div>

    <div style="font-size: 14px; color: #8b9199; line-height: 1.75; margin-top: 18px; max-width: 620px;">前四半期の数字と、8月のインシデント件数の推移を入れる。</div>

    <div style="height: 1px; background: rgba(255,255,255,0.08); margin: 26px 0 20px 0; max-width: 620px;"></div>

    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 14px;">
      <span style="font-size: 12px; color: #7a8089;">サブタスク</span>
      <span style="font-size: 12px; color: #c8ccd2; font-variant-numeric: tabular-nums;">1 / 3</span>
      <div style="width: 120px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.10); overflow: hidden;"><div style="width: 33%; height: 100%; background: #4cc2ff;"></div></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; max-width: 620px;">
      <label style="display: flex; align-items: center; gap: 12px; height: 34px; cursor: pointer;">
        <input type="checkbox" checked aria-label="素材を集める を未完了にする" style="width: 17px; height: 17px; margin: 0;">
        <span style="font-size: 15px; color: #5f6670; text-decoration: line-through;">素材を集める</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; height: 34px; cursor: pointer;">
        <input type="checkbox" aria-label="グラフを作る を完了にする" style="width: 17px; height: 17px; margin: 0;">
        <span style="font-size: 15px; color: #ffffff;">グラフを作る</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; height: 34px; cursor: pointer;">
        <input type="checkbox" aria-label="見出しを整える を完了にする" style="width: 17px; height: 17px; margin: 0;">
        <span style="font-size: 15px; color: #ffffff;">見出しを整える</span>
      </label>
    </div>
  </div>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 64px 30px 64px;">
    <button type="button" style="display: flex; align-items: center; gap: 9px; height: 42px; padding: 0 22px; font-size: 14px; font-weight: 500; font-family: inherit; color: #ffffff; background: #0067c0; border: none; border-radius: 6px; cursor: pointer;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 6.2 11.5 13 4.8"/></svg>
      完了して次へ
    </button>
    <button type="button" style="height: 42px; padding: 0 18px; font-size: 14px; font-family: inherit; color: #c8ccd2; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; cursor: pointer;">今はやらない</button>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 14px; font-size: 11px; color: #5f6670;">
      <span><strong style="font-family: Consolas, monospace; font-weight: 600; color: #7a8089;">Space</strong> 完了</span>
      <span><strong style="font-family: Consolas, monospace; font-weight: 600; color: #7a8089;">→</strong> 次へ</span>
      <span><strong style="font-family: Consolas, monospace; font-weight: 600; color: #7a8089;">Esc</strong> 戻る</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":640}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
